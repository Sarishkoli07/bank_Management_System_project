# ---------- Server ----------
server.port=8080

# ---------- Database (H2 - saved as a file in ./data/bankdb.mv.db) ----------
spring.datasource.url=jdbc:h2:file:./data/bankdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# update = tables are created automatically, old data is kept
spring.jpa.hibernate.ddl-auto=update
# show-sql prints the SQL queries in the console (useful for learning)
spring.jpa.show-sql=true

# ---------- H2 Console (view the database in the browser) ----------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- To use MySQL instead of H2 ----------
# 1) Comment the H2 datasource lines above
# 2) Add mysql-connector-j dependency in pom.xml
# 3) Un-comment these lines and put your password
# spring.datasource.url=jdbc:mysql://localhost:3306/bankdb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
